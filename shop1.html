<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Shop1</title>
    <script type="module" src="./shop1.ts"></script>
    <link rel="stylesheet" href="./shop1.css">
</head>

<body>

    <h1>Buy Three Items</h1>

    <table>
        <thead>
            <tr>
            <thead scope="row">Shopping Cart
<table>
    <thead>
        <tr>
            <th>Item</th>
            <th name="unit-price">Unit Price</th>
            <th name="quantity">Quantity</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>Apple</td>
            <td>£0.33</td>
            <td>6</td>
        </tr>
        <tr>
            <td>Grapes</td>
            <td>£3.00</td>
            <td>1</td>
        </tr>
        <tr>
            <td>Oranges</td>
            <td>£0.25</td>
            <td>12</td>
        </tr>
     </tbody>
    <tfoot>
        <tr>
            <td><button id="calculate-total">Sum</button></td>
            <td>Total</td>
            <td id="payment">--</td> 
        </tr>
        <tr>
            <td>&nbsp;</td>
            <td>Total with 25% Discount</td>
            <td id="discount">--</td>
        </tr>
    </tfoot>
</table>
</body>
</html>
